name: almonds
description: "Scan food barcodes to see what's really inside: a health score, harmful additives and nutrition breakdown."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.5.0
  provider: ^6.1.5+1
  supabase_flutter: ^2.10.3
  mobile_scanner: ^7.1.3
  haptic_feedback: ^0.8.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uikit_tab_bar: ^0.2.1
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
